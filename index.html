<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тренажер Оператора ЖКХ</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        header { background: #2c3e50; color: white; padding: 15px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        
        #chat-container { flex: 1; max-width: 600px; margin: 20px auto; width: 95%; background: white; border-radius: 10px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        #messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        
        .msg { padding: 10px 15px; border-radius: 18px; max-width: 80%; font-size: 14px; line-height: 1.4; }
        .client { background: #e1f5fe; align-self: flex-start; border-bottom-left-radius: 2px; color: #01579b; }
        .operator { background: #0084ff; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }

        .input-area { padding: 15px; border-top: 1px solid #eee; display: flex; gap: 10px; }
        input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 20px; outline: none; }
        button { background: #0084ff; color: white; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-weight: bold; }
        button:hover { background: #0073e6; }
    </style>
</head>
<body>

<header>
    <h2>Симулятор: Обращения по ЖКХ</h2>
    <small>Роль: Оператор поддержки</small>
</header>

<div id="chat-container">
    <div id="messages">
        <div class="msg client">Здравствуйте! Я по поводу квитанции. Почему у меня за отопление сумма в два раза больше, чем в прошлом месяце?!</div>
    </div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Введите ваш ответ..." onkeypress="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">Отправить</button>
    </div>
</div>

<script>
    const messagesDiv = document.getElementById('messages');
    const input = document.getElementById('userInput');

    // База фраз "клиента"
    const clientPhrases = [
        "У нас в подъезде лампочка перегорела уже неделю, когда замените?",
        "Опять горячей воды нет! Вы предупреждали? Я ничего не видел!",
        "В квитанции какая-то ошибка по кап-ремонту. Куда мне жаловаться?",
        "Соседи сверху заливают, срочно пришлите аварийку!",
        "А можно ли подать показания счетчиков через этот чат?"
    ];

    function addMessage(text, type) {
        const div = document.createElement('div');
        div.className = 'msg ' + type;
        div.textContent = text;
        messagesDiv.appendChild(div);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function sendMessage() {
        const text = input.value.trim();
        if (!text) return;

        addMessage(text, 'operator');
        input.value = '';

        // Имитация "печатает..." и случайного ответа клиента через 1.5 сек
        setTimeout(() => {
            const randomPhrase = clientPhrases[Math.floor(Math.random() * clientPhrases.length)];
            addMessage(randomPhrase, 'client');
        }, 1500);
    }
</script>

</body>
</html>
